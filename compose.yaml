services:
  web:
    container_name: my-nginx
    build: ./myapp
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8081:80"
    volumes:
      - ./website:/usr/share/nginx/html
    depends_on:
      - database

  database:
    container_name: my-mysql
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

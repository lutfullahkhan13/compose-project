name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website
        run: |
          test -f website/index.html
          echo "Website file exists"

      - name: Build Docker image
        run: docker build -t myapp-test ./myapp
